# Konfiguracja Nginx jako reverse proxy (VPS).
# Instalacja: sudo cp nginx-sportowa-szkola.conf /etc/nginx/sites-available/sportowa-szkola
#             sudo ln -s /etc/nginx/sites-available/sportowa-szkola /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d twojadomena.pl  (po skierowaniu domeny na serwer)
server {
    listen 80;
    server_name _;  # tu mozesz wpisac swoja domene, np. sport.twojaszkola.pl

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
